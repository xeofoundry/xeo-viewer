name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - id: version
        run: |
          name=$(node -p "require('./npm/package.json').name")
          version=$(node -p "require('./npm/package.json').version")

          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm, skipping publish"
          fi

      - if: steps.version.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.published != 'true'
        run: pnpm build:npm

      - if: steps.version.outputs.published != 'true'
        run: npm publish
        working-directory: dist/webcomponent
